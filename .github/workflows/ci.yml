name: ci
# A push runs on main only; a pull request already runs its branch.
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  # A new push to a pull request cancels the run it supersedes. Every other run (main, a tag) has a group of its own
  # and is never cancelled; the run id keeps two pushes to main from replacing each other while one is queued.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # no Fedora release written into a job: the cells come from check-matrix (rule 11-10, ruling D25)
  fedora-cells:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/workflows
      - uses: Open-Mixer/.github/.github/actions/fedora-cells@openmixer-v1

  test:
    name: build + test (${{ matrix.image }})
    runs-on: ubuntu-latest
    # A backstop only: every test carries its own timeout (tests/run-test.sh).
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ['fedora:44', 'debian:bookworm', 'debian:trixie']
    container: ${{ matrix.image }}
    steps:
      - name: Toolchain
        run: |
          if command -v dnf >/dev/null; then
            dnf -y install gcc make git pkgconf-pkg-config diffutils python3-pyyaml
          else
            apt-get update && apt-get -y install --no-install-recommends gcc libc6-dev make git pkg-config ca-certificates python3-yaml
          fi
      - uses: actions/checkout@v4
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build
        run: make
      - name: Unit tests
        run: make test
      - name: Shared library
        run: make shared
      - name: Install, and build a consumer against the installed tree
        run: |
          make install PREFIX=/usr DESTDIR="$PWD/stage"
          cat > consumer.c <<'C'
          #include <mackie/mackie_codec.h>
          int main(void)
          {
                  struct mackie_msg m;
                  return mackie_device_query_encode(MACKIE_MODEL_MCU, &m) == MACKIE_OK && m.len == 7 ? 0 : 1;
          }
          C
          PKG_CONFIG_SYSROOT_DIR="$PWD/stage" PKG_CONFIG_LIBDIR="$PWD/stage/usr/lib/pkgconfig" \
            sh -c 'cc consumer.c $(pkg-config --cflags --libs libmackie) -o consumer'
          ./consumer

  # the checks every OpenMixer repository runs on what it publishes: commit messages, private references, and no
  # local copy of either (Open-Mixer/.github's public-sources-check)
  public-sources:
    uses: Open-Mixer/.github/.github/workflows/public-sources-check.yml@openmixer-v1
